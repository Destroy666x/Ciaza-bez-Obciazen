articles:
  - slug: zdrowie/zdrowie-psychiczne
    category: zdrowie/zdrowie-psychiczne
    title:
      en: Mental wellbeing during pregnancy
      pl: Zdrowie psychiczne w ciąży
    summary:
      en: How to spot overload, when to ask for support, and what helps in everyday life.
      pl: Jak rozpoznać przeciążenie, kiedy szukać pomocy i co pomaga na co dzień.
    tags:
      en: [health, psychology, support]
      pl: [zdrowie, psychologia, wsparcie]
    links:
      - label:
          en: Pregnancy psychology guidance — gov.pl
          pl: Poradnia psychologiczna w ciąży — gov.pl
        url: https://www.gov.pl/web/zdrowie
      - label:
          en: Useful information about mental health
          pl: Ważne informacje o zdrowiu psychologicznym
        url: https://www.rynekzdrowia.pl/
    content:
      en:
        - "Many women feel more sensitive, tired, or worried during pregnancy. This is not a sign of weakness; it is a sign that your body and mind need steadiness."
        - "Common signs that are worth noting include exhaustion, rising anxiety, irritability, sleep disruption, feeling overwhelmed, or mood swings."
        - "A regular daily rhythm, support from a partner, conversations with a clinician or psychologist, and reliable sources of information all help. If these symptoms continue, contact your clinic or mental health specialist."
        - "If you feel unable to control your emotions or fear for your safety or your baby's safety, contact your midwife, doctor, or an urgent support line immediately."
      pl:
        - "W ciąży wiele kobiet doświadcza większej wrażliwości, zmęczenia i niepokoju. To nie jest oznaka słabości, tylko sygnał, że organizm i psychika potrzebują stabilizacji."
        - "Najczęstsze objawy, które warto zgłosić, to przewlekłe zmęczenie, narastający niepokój, drażliwość, trudności ze snem, poczucie przytłoczenia czy wahania nastroju."
        - "Dobrze działa regularny rytm dnia, wsparcie partnera, rozmowy z lekarzem lub psychologiem oraz korzystanie z bezpiecznych źródeł informacji. W razie takich objawów warto skontaktować się z przychodnią lub specjalistą od zdrowia psychicznego."
        - "Jeżeli czujesz, że traciłaś kontrolę nad emocjami albo obawiasz się o bezpieczeństwo siebie lub dziecka, natychmiast skontaktuj się z położną, lekarzem lub numerem pomocy."

  - slug: zdrowie/jak-zaplanowac-badania
    category: zdrowie/jak-zaplanowac-badania
    title:
      en: How to plan check-ups and prenatal visits
      pl: Jak zaplanować badania i wizyty kontrolne
    summary:
      en: When to schedule appointments and what tests are recommended during each trimester.
      pl: Kiedy i jakie badania są obowiązkowe w poszczególnych trymestrach ciąży.
    tags:
      en: [screening, check-ups, pregnancy plan]
      pl: [badania, kontrola, ciążowy plan]
    links:
      - label:
          en: Prenatal appointments calendar
          pl: Kalendarz wizyt prenatalnych
        url: https://www.gov.pl/web/zdrowie
      - label:
          en: Pregnancy care and follow-up overview
          pl: Jak wygląda opieka okołoporodowa
        url: https://www.mp.pl/
    content:
      en:
        - "Your first appointment should happen as soon as possible after confirming the pregnancy. Your doctor or midwife will assess your health, calculate the due date, and plan your tests."
        - "In the first trimester, blood tests, blood pressure checks, and a medical history review are commonly done. In the second trimester, ultrasound scans and monitoring of fetal development are usually scheduled."
        - "In the third trimester, key checks include blood pressure monitoring, birth planning, and ensuring your care team has a clear plan for delivery."
        - "The best approach is to keep a simple calendar of appointments and write down questions in advance so nothing important is missed."
      pl:
        - "Pierwsza wizyta powinna odbyć się tak szybko, jak to możliwe po potwierdzeniu ciąży. Lekarz lub położna oceniją przebieg, obliczą termin porodu i zaplanują badania."
        - "W pierwszym trymestrze często wykonuje się badania laboratoryjne, ocenę ciśnienia i wywiad. W drugim trymestrze zwykle przewidziane są badania ultrasonograficzne oraz kontrole rozwoju płodu."
        - "W trzecim trymestrze kluczowe są monitorowanie ciśnienia, kształtowanie planu porodu i sprawdzanie przygotowania do porodu w placówce."
        - "Najważniejsze jest prowadzenie kalendarza wizyt i zapisywanie pytań, aby nie pominąć żadnej istotnej kwestii."

  - slug: zdrowie/porod
    category: zdrowie/porod
    title:
      en: Birth and what to expect during labor
      pl: Poród i to, czego można się spodziewać podczas porodu
    summary:
      en: What helps during labor, how to prepare, and how to communicate with the care team.
      pl: Jak przygotować się do porodu i jak zadbać o komunikację z personelem medycznym.
    tags:
      en: [birth, labor, preparation]
      pl: [poród, przygotowanie, opieka]
    links:
      - label:
          en: Birth preparation guidance
          pl: Poradnik przygotowania do porodu
        url: https://www.gov.pl/web/zdrowie
      - label:
          en: Maternity ward and delivery support
          pl: Opieka nad kobietą w porodzie
        url: https://www.mp.pl/
    content:
      en:
        - "A birth plan can be useful, but it is also important to stay flexible if your healthcare team suggests a different course of action. The main goal is safety and support for you and your baby."
        - "It helps to have a clear idea of who will accompany you, what pain-relief options you prefer, and what practical items you want ready at the hospital."
        - "During labor, you may feel a range of emotions: fear, strength, exhaustion, and relief. All of that can be part of the process."
        - "If you notice significant bleeding, severe pain, very little movement from the baby, or a sudden increase in symptoms, contact your medical team or go to the maternity ward urgently."
      pl:
        - "Plan porodu może być przydatny, ale równie ważna jest elastyczność, jeśli zespół medyczny zaleci inny kierunek postępowania. Najważniejsze są bezpieczeństwo i wsparcie dla Ciebie oraz dziecka."
        - "Warto wcześniej ustalić, kto będzie przy Tobie, jakie metody łagodzenia bólu są dla Ciebie preferowane i co warto mieć przygotowane w szpitalu."
        - "W trakcie porodu możesz przeżywać różne emocje: strach, siłę, zmęczenie i ulgę. To normalne i część procesu."
        - "Jeśli pojawi się silne krwawienie, bardzo duży ból, bardzo mało ruchów dziecka lub nagły wzrost objawów, skontaktuj się z personelem medycznym lub udaj się natychmiast do szpitala."

  - slug: zdrowie/leki-i-suplementy
    category: zdrowie/leki-i-suplementy
    title:
      en: Medicines, supplements, and everyday choices during pregnancy
      pl: Leki, suplementy i codzienne wybory w ciąży
    summary:
      en: How to think about treatment, supplements, and safe decision-making with your clinician.
      pl: Jak podejmować decyzje o lekach, suplementach i codziennych wyborach z lekarzem lub położną.
    tags:
      en: [medications, supplements, safety]
      pl: [leki, suplementy, bezpieczeństwo]
    links:
      - label:
          en: Safe medication information for pregnancy
          pl: Informacje o bezpiecznym stosowaniu leków w ciąży
        url: https://www.gov.pl/web/zdrowie
      - label:
          en: Prenatal supplement guidance
          pl: Porady odnośnie suplementacji w ciąży
        url: https://www.mp.pl/
    content:
      en:
        - "Some <b>supplements</b> are recommended during pregnancy, but the exact choice should be adapted to your situation and the guidance of your clinician."
        - "Before taking any medicine, including over-the-counter products, ask whether it is safe in your trimester and whether it can interact with your current treatment."
        - "It is worth keeping a list of medicines, vitamins, and supplements you use so that every care visit is well informed."
        - "If you are unsure, don't stop or start treatment without checking with a doctor or midwife."
      pl:
        - "Niektóre <b>suplementy</b> są zalecane w ciąży, ale ich dobór powinien być dostosowany do Twojej sytuacji i zaleceń lekarza lub położnej."
        - "Zanim zaczniesz brać dowolny lek, również bez recepty, sprawdź, czy jest bezpieczny w danym trymestrze i czy nie koliduje z innym leczeniem."
        - "Warto prowadzić listę leków, witamin i suplementów, aby każda wizyta kontrolna była dobrze udokumentowana."
        - "Jeśli masz wątpliwości, nie przerywaj ani nie rozpoczynaj leczenia bez konsultacji z lekarzem lub położną."

  - slug: prawo/ulga-800-plus
    category: prawo/ulga-800-plus
    title:
      en: How to apply for Family 800 Plus and other childcare benefits
      pl: Jak wystąpić o 800 Plus i inne świadczenia
    summary:
      en: When and how to apply for family allowances and child-related support.
      pl: Kiedy i jak ubiegać się o świadczenia dla dziecka i dodatki rodzinne.
    tags:
      en: [rights, benefits, family support]
      pl: [prawo, świadczenia, 800 plus]
    links:
      - label:
          en: Family benefits information
          pl: 800 Plus w ZUS i gov.pl
        url: https://www.gov.pl/web/rodzina
      - label:
          en: Family allowance and support overview
          pl: Informacja o świadczeniach rodzinnych
        url: https://www.zus.pl/
    content:
      en:
        - "Family benefits are often based on income, the number of children, and your family situation. In practice, the application is usually submitted through the local office or online portal."
        - "If you are pregnant or have a newborn, it is worth checking your entitlements early, because support may be available once the relevant rules are met."
        - "You may also qualify for additional support when healthcare, childcare, rehabilitation, or other essential costs arise."
        - "Keep copies of documents, note the dates of submitting applications, and ask for written confirmation whenever possible to keep track of the case clearly."
      pl:
        - "Świadczenia rodzinne są przyznawane na podstawie dochodów, liczby dzieci i sytuacji rodzinnej. W praktyce wniosek składa się w urzędzie gminy lub miasta, a niekiedy w systemie online."
        - "W przypadku ciąży i urodzenia dziecka warto sprawdzić status świadczeń, która jest dostępna od chwili powstania prawa do zasiłku lub dodatku."
        - "Dodatkowo można składać wnioski o pomoc w sytuacjach szczególnych, gdy pojawiają się koszty opieki, leczenia czy rehabilitacji."
        - "Warto zachować kopie dokumentów, daty złożenia wniosków i przyjmować informacje pisemne, aby bezpiecznie monitorować status sprawy."

  - slug: prawo/zwolnienie-od-pracy
    category: prawo/zwolnienie-od-pracy
    title:
      en: Pregnancy leave and workplace rights
      pl: Prawo do zwolnienia i urlopów w ciąży
    summary:
      en: What pregnancy protections cover and how to use different leave options.
      pl: Co obejmuje ochrona pracownicy w ciąży i kiedy korzystać z różnych form urlopu.
    tags:
      en: [work rights, leave, protection]
      pl: [prawo pracy, urlop, ochrona]
    links:
      - label:
          en: Legal information on employee protection
          pl: Ustawy i informacje o ochronie pracowniczej
        url: https://isap.sejm.gov.pl/
      - label:
          en: Pregnancy and employment advice
          pl: Porady pracownicze w zakresie ciąży
        url: https://www.mpips.gov.pl/
    content:
      en:
        - "Pregnant employees are entitled to protection from dismissal and to use the leave and support options available under employment law."
        - "It is useful to understand appointment scheduling, time off during pregnancy, and arrangements for returning to work after childbirth."
        - "Check the deadlines for notifying your employer, the periods of maternity leave, and the possibility of taking leave earlier if needed."
        - "If you are unsure about your rights, speak with a worker advisor or your local support centre before making decisions."
      pl:
        - "Pracownica w ciąży ma prawo do ochrony przed zwolnieniem i do korzystania z przysługujących jej przepisów dotyczących urlopów."
        - "W praktyce istotne są kwestie związane z badaniami lekarskimi, zwolnieniami od pracy w trakcie ciąży oraz planowaniem powrotu do pracy po porodzie."
        - "Warto znać termin zgłoszenia do pracodawcy, terminy urlopu macierzyńskiego i możliwości wcześniejszego korzystania z urlopu."
        - "Jeżeli masz wątpliwości co do swoich praw, skonsultuj sprawę z doradcą pracowniczym albo z lokalnym punktem pomocy."

  - slug: finanse/benefity-dla-rodzin
    category: finanse/benefity-dla-rodzin
    title:
      en: Benefits and aid for families with a baby
      pl: Benefity i pomoc dla rodzin z dzieckiem
    summary:
      en: How to check available support, grants, and family assistance when circumstances are challenging.
      pl: Jak sprawdzić dostępne świadczenia, zasiłki i wsparcie dla rodzin w trudnej sytuacji.
    tags:
      en: [finances, benefits, support]
      pl: [finanse, zasiłki, wsparcie]
    links:
      - label:
          en: Family benefits rules
          pl: Zasady świadczeń rodzinnych
        url: https://www.gov.pl/web/rodzina
      - label:
          en: Support and aid overview
          pl: Informacja o zasiłkach i pomocach
        url: https://www.gov.pl/web/rodzina
    content:
      en:
        - "During pregnancy and after the baby is born, it is worth checking for financial help, food supplements, and care benefits if your situation requires extra support."
        - "Many families are eligible for grants or local programmes. It is also worth checking what support is available in your local area."
        - "If the situation is difficult, speak with a welfare advisor or local support centre. Gathering documents and income information in one place makes applications easier."
      pl:
        - "W okresie ciąży i po narodzinach dziecka warto sprawdzić dostępność zasiłków, dodatków do żywności i świadczeń opiekuńczych, jeśliTwoja sytuacja wymaga pomocy."
        - "Wiele rodzin ma prawo do pomocy finansowej lub możliwości skorzystania z programów lokalnych. Warto sprawdzić także dostępne zakłady w rejonie zamieszkania."
        - "Jeżeli sytuacja jest trudna, skontaktuj się z osobą doradczą w urzędzie lub lokalnym centrum pomocy. Warto zorganizować dokumenty i wyniki dochodów do wniosku."

  - slug: praca/plan-powrotu-do-pracy
    category: praca/plan-powrotu-do-pracy
    title:
      en: A return-to-work plan after childbirth
      pl: Plan powrotu do pracy po porodzie
    summary:
      en: How to prepare for returning to work while protecting your wellbeing and childcare situation.
      pl: Jak przygotować się do powrotu do pracy i jak zadbać o pracę, opiekę i rytm dnia.
    tags:
      en: [return to work, parenting, planning]
      pl: [powrót do pracy, rodzicielstwo, planowanie]
    links:
      - label:
          en: Leave and childcare information
          pl: Informacja o urlopach i opiece
        url: https://www.gov.pl/web/rodzina
      - label:
          en: Parenting and employment advice
          pl: Porady rodzicielskie i pracownicze
        url: https://www.mpips.gov.pl/
    content:
      en:
        - "It helps to plan a return to work in the late stages of pregnancy so you are not overloaded and your childcare arrangements are in place."
        - "Consider different scenarios: grandparents, a nursery, a nanny, part-time work, or a flexible schedule."
        - "It is useful to set priorities before maternity leave ends so the transition feels steadier and less stressful."
      pl:
        - "Dobrze zaplanować powrót do pracy na etapie późnej ciąży, aby nie przeciążyć organizmu i zapewnić odpowiednią opiekę nad dzieckiem."
        - "Rozważ różne scenariusze: opiekę dziadków, żłobek, nianię, część etatu czy elastyczny grafika."
        - "Pomocne jest ustalenie rezerw i priorytetów, zanim minie okres urlopu macierzyńskiego."

  - slug: zdrowie/polog/regeneracja-po-porodzie
    category: zdrowie/polog
    title:
      en: Postpartum recovery and the first weeks after birth
      pl: Połóg i regeneracja w pierwszych tygodniach po porodzie
    summary:
      en: What happens during postpartum recovery, which symptoms are expected, and when to seek medical advice.
      pl: Co dzieje się w połogu, które objawy są typowe i kiedy należy skonsultować się z lekarzem.
    tags:
      en: [postpartum, recovery, health]
      pl: [połóg, regeneracja, zdrowie]
    links:
      - label:
          en: Postpartum care information
          pl: Informacje o opiece w połogu
        url: https://www.gov.pl/web/zdrowie
      - label:
          en: Postpartum recovery guidance
          pl: Poradnik dotyczący połogu
        url: https://www.mp.pl/
    content:
      en:
        - "The first weeks after birth are a period of recovery for both the body and mind. Tiredness, bleeding, breast tenderness, and emotional changes can occur during this time."
        - "Rest, adequate food and fluids, gentle movement when medically appropriate, and practical help from other people can make recovery easier."
        - "Postpartum bleeding normally changes over time, but very heavy bleeding, severe abdominal pain, fever, fainting, or rapidly worsening symptoms require medical assessment."
        - "A postpartum check-up is an opportunity to discuss healing, contraception, pelvic floor symptoms, breastfeeding, mood, and any concerns after delivery."
      pl:
        - "Pierwsze tygodnie po porodzie to czas regeneracji organizmu i psychiki. W tym okresie mogą występować zmęczenie, krwawienie, tkliwość piersi oraz zmiany emocjonalne."
        - "Odpoczynek, odpowiednie nawodnienie i odżywianie, łagodny ruch, gdy jest medycznie wskazany, oraz praktyczna pomoc innych osób mogą ułatwić powrót do sił."
        - "Krwawienie po porodzie zwykle stopniowo się zmienia, ale bardzo obfite krwawienie, silny ból brzucha, gorączka, omdlenie lub szybko nasilające się objawy wymagają konsultacji medycznej."
        - "Wizyta kontrolna po porodzie pozwala omówić gojenie, antykoncepcję, objawy związane z dnem miednicy, karmienie piersią, samopoczucie i inne niepokojące kwestie."

  - slug: zdrowie/etapy-ciazy/szczepienia-w-ciazy
    category: zdrowie/etapy-ciazy
    title:
      en: Vaccinations during pregnancy
      pl: Szczepienia w ciąży
    summary:
      en: Why selected vaccinations may be recommended during pregnancy and how to discuss them with your clinician.
      pl: Dlaczego niektóre szczepienia mogą być zalecane w ciąży i jak omówić je z lekarzem.
    tags:
      en: [vaccination, pregnancy, prevention]
      pl: [szczepienia, ciąża, profilaktyka]
    links:
      - label:
          en: Vaccination information
          pl: Informacje o szczepieniach
        url: https://www.gov.pl/web/szczepimysie
      - label:
          en: Vaccination recommendations
          pl: Zalecenia dotyczące szczepień
        url: https://szczepienia.pzh.gov.pl/
    content:
      en:
        - "Some vaccinations are recommended during pregnancy because they can protect the pregnant person and, in some cases, provide the newborn with temporary protection through antibodies."
        - "The appropriate timing depends on the vaccine, pregnancy stage, individual health, and current recommendations."
        - "Tell your doctor or midwife which vaccinations you have already received and whether you have any medical conditions or previous vaccine reactions."
        - "Do not start or postpone vaccination based only on information found online. Discuss the appropriate schedule with a healthcare professional."
      pl:
        - "Niektóre szczepienia są zalecane w ciąży, ponieważ mogą chronić ciężarną, a w określonych przypadkach także zapewnić noworodkowi czasową ochronę dzięki przekazanym przeciwciałom."
        - "Odpowiedni termin szczepienia zależy od rodzaju szczepionki, etapu ciąży, stanu zdrowia i aktualnych zaleceń."
        - "Warto poinformować lekarza lub położną o wykonanych wcześniej szczepieniach, chorobach przewlekłych i ewentualnych reakcjach na wcześniejsze szczepionki."
        - "Nie należy samodzielnie odkładać ani rozpoczynać szczepień wyłącznie na podstawie informacji znalezionych w internecie. Harmonogram najlepiej ustalić z personelem medycznym."

  - slug: zdrowie/polog/karmienie-piersia
    category: zdrowie/polog
    title:
      en: Breastfeeding basics and getting support
      pl: Podstawy karmienia piersią i kiedy szukać wsparcia
    summary:
      en: Practical information about the first days of breastfeeding, feeding difficulties, and professional support.
      pl: Praktyczne informacje o pierwszych dniach karmienia piersią, trudnościach i dostępnej pomocy.
    tags:
      en: [breastfeeding, newborn, support]
      pl: [karmienie piersią, noworodek, wsparcie]
    links:
      - label:
          en: Breastfeeding and infant feeding information
          pl: Informacje o karmieniu piersią i żywieniu niemowląt
        url: https://www.gov.pl/web/gis
      - label:
          en: Breastfeeding guidance
          pl: Porady dotyczące karmienia piersią
        url: https://www.mp.pl/
    content:
      en:
        - "The first days of breastfeeding can require practice for both parent and baby. Feeding frequency and patterns can vary considerably between newborns."
        - "A midwife, lactation consultant, or other qualified professional can help with positioning, latch, painful feeding, or concerns about whether the baby is feeding effectively."
        - "Persistent severe nipple pain, breast redness with fever, or concerns about the baby's hydration or feeding should be discussed with a healthcare professional."
        - "If breastfeeding is not possible or does not work as planned, feeding support should focus on the health and wellbeing of both parent and baby rather than on guilt."
      pl:
        - "Pierwsze dni karmienia piersią mogą wymagać nauki zarówno od rodzica, jak i od dziecka. Częstotliwość karmień i ich przebieg mogą znacznie się różnić u poszczególnych noworodków."
        - "Położna, doradca laktacyjny lub inny wykwalifikowany specjalista może pomóc w prawidłowym przystawianiu, pozycji, bolesnym karmieniu i ocenie skuteczności karmienia."
        - "Utrzymujący się silny ból brodawek, zaczerwienienie piersi z gorączką lub obawy dotyczące nawodnienia i karmienia dziecka należy skonsultować z personelem medycznym."
        - "Jeżeli karmienie piersią nie jest możliwe albo nie przebiega zgodnie z planem, najważniejsze jest zdrowie i dobrostan rodzica oraz dziecka, a nie poczucie winy."

  - slug: zdrowie/polog/badania-noworodka
    category: zdrowie/polog
    title:
      en: Newborn screening and health checks
      pl: Badania przesiewowe i kontrole zdrowia noworodka
    summary:
      en: What newborn screening is designed to detect and why early checks are important.
      pl: Co wykrywają badania przesiewowe noworodków i dlaczego wczesna kontrola ma znaczenie.
    tags:
      en: [newborn, screening, prevention]
      pl: [noworodek, badania, profilaktyka]
    links:
      - label:
          en: Newborn screening programme
          pl: Program badań przesiewowych noworodków
        url: https://www.gov.pl/web/zdrowie
      - label:
          en: Child health information
          pl: Informacje dotyczące zdrowia dziecka
        url: https://www.mp.pl/
    content:
      en:
        - "Newborn screening helps identify selected conditions before symptoms become obvious. Early detection can allow treatment or monitoring to begin sooner."
        - "After birth, newborns also receive routine assessments of their general condition, feeding, development, and selected physical functions."
        - "Parents should keep records of screening results and scheduled follow-up appointments and ask what to do if a result requires additional testing."
        - "A screening result that requires follow-up does not automatically mean that a child has a disease. Further testing is often needed to clarify the result."
      pl:
        - "Badania przesiewowe noworodków pomagają wykryć wybrane choroby, zanim pojawią się wyraźne objawy. Wczesne rozpoznanie może umożliwić szybsze rozpoczęcie leczenia lub obserwacji."
        - "Po porodzie noworodek przechodzi również rutynową ocenę ogólnego stanu zdrowia, karmienia, rozwoju i wybranych funkcji organizmu."
        - "Warto przechowywać wyniki badań oraz terminy kontroli i zapytać personel, co należy zrobić, jeśli wynik wymaga dalszej diagnostyki."
        - "Wynik przesiewowy wymagający kontroli nie oznacza automatycznie choroby. Często potrzebne są dodatkowe badania, aby właściwie go zinterpretować."

  - slug: prawo/prawa-rodzicow/prawa-ojca-po-urodzeniu-dziecka
    category: prawo/prawa-rodzicow
    title:
      en: A father's rights and leave after the birth of a child
      pl: Prawa ojca i urlopy po urodzeniu dziecka
    summary:
      en: An overview of leave options available to fathers and how they fit into family leave arrangements.
      pl: Przegląd urlopów i uprawnień ojca oraz ich miejsca w organizacji opieki nad dzieckiem.
    tags:
      en: [father, parental rights, leave]
      pl: [ojciec, prawa rodzicielskie, urlop]
    links:
      - label:
          en: Parental leave information
          pl: Informacje o urlopach rodzicielskich
        url: https://www.gov.pl/web/rodzina
      - label:
          en: Labour law information
          pl: Informacje z zakresu prawa pracy
        url: https://www.gov.pl/web/rodzina
    content:
      en:
        - "Fathers who are employees may have several forms of leave and time off connected with the birth and care of a child."
        - "The exact entitlement depends on the current employment rules, the family's situation, and which parent uses particular parts of leave."
        - "Some rights have specific deadlines or require an application to the employer, so it is worth checking the rules before the planned leave begins."
        - "When parents share care, it is useful to compare the available leave options with household income, childcare needs, and the planned return to work."
      pl:
        - "Ojciec zatrudniony na podstawie umowy o pracę może korzystać z różnych form urlopu i zwolnień związanych z narodzinami oraz opieką nad dzieckiem."
        - "Zakres uprawnień zależy od aktualnych przepisów, sytuacji rodziny oraz tego, z których części urlopu korzystają poszczególni rodzice."
        - "Niektóre uprawnienia mają określone terminy lub wymagają złożenia wniosku u pracodawcy, dlatego warto sprawdzić zasady przed planowanym urlopem."
        - "Przy dzieleniu opieki warto porównać dostępne rozwiązania z dochodami rodziny, potrzebami dziecka i planowanym powrotem do pracy."

  - slug: prawo/urlopy/urlop-rodzicielski
    category: prawo/urlopy
    title:
      en: How parental leave works
      pl: Jak działa urlop rodzicielski
    summary:
      en: How parents can plan parental leave and what to check before submitting an application.
      pl: Jak zaplanować urlop rodzicielski i co sprawdzić przed złożeniem wniosku.
    tags:
      en: [parental leave, employment, rights]
      pl: [urlop rodzicielski, praca, prawa]
    links:
      - label:
          en: Official parental leave information
          pl: Oficjalne informacje o urlopie rodzicielskim
        url: https://www.gov.pl/web/rodzina
      - label:
          en: Employee rights information
          pl: Informacje o prawach pracownika
        url: https://www.gov.pl/web/rodzina
    content:
      en:
        - "Parental leave is intended to allow parents to care for a child after the period associated with maternity leave."
        - "Parents can plan how to divide available leave between them, subject to the current statutory rules and individual eligibility."
        - "Before submitting an application, check the required deadlines, the period requested, and the documents required by your employer."
        - "Because employment and benefit rules can change, current official information should be checked before making a financial or employment decision."
      pl:
        - "Urlop rodzicielski służy opiece nad dzieckiem po okresie związanym z urlopem macierzyńskim."
        - "Rodzice mogą planować podział dostępnego urlopu między siebie, z uwzględnieniem aktualnych przepisów i indywidualnego prawa do świadczeń."
        - "Przed złożeniem wniosku warto sprawdzić wymagane terminy, okres urlopu oraz dokumenty, których wymaga pracodawca."
        - "Ponieważ przepisy dotyczące zatrudnienia i świadczeń mogą się zmieniać, przed podjęciem decyzji finansowej lub zawodowej należy sprawdzić aktualne informacje."

  - slug: prawo/urlopy/urlop-wychowawczy
    category: prawo/urlopy
    title:
      en: Childcare leave and taking a longer break from work
      pl: Urlop wychowawczy i dłuższa przerwa w pracy na opiekę nad dzieckiem
    summary:
      en: When childcare leave can be useful and what parents should consider before taking it.
      pl: Kiedy urlop wychowawczy może być rozwiązaniem i co warto rozważyć przed jego rozpoczęciem.
    tags:
      en: [childcare leave, work, parenting]
      pl: [urlop wychowawczy, praca, rodzicielstwo]
    links:
      - label:
          en: Childcare leave information
          pl: Informacje o urlopie wychowawczym
        url: https://www.gov.pl/web/rodzina
      - label:
          en: Employment rights
          pl: Prawa pracownika
        url: https://www.gov.pl/web/rodzina
    content:
      en:
        - "Childcare leave can provide a longer period away from work for direct care of a child when the statutory conditions are met."
        - "Before taking leave, consider household income, health insurance, childcare arrangements, pension implications, and the planned date of returning to work."
        - "The application should be prepared according to the current rules and submitted within the required timeframe."
        - "If the financial impact is significant, compare childcare leave with part-time work or other flexible arrangements before making the decision."
      pl:
        - "Urlop wychowawczy może umożliwić dłuższą przerwę w pracy w celu osobistej opieki nad dzieckiem, jeśli spełnione są ustawowe warunki."
        - "Przed rozpoczęciem urlopu warto uwzględnić dochody gospodarstwa domowego, ubezpieczenie, organizację opieki, wpływ na przyszłe świadczenia oraz planowany powrót do pracy."
        - "Wniosek należy przygotować zgodnie z aktualnymi przepisami i złożyć w wymaganym terminie."
        - "Jeżeli przerwa w pracy znacząco zmieni sytuację finansową rodziny, warto porównać ją z pracą na część etatu lub innymi elastycznymi rozwiązaniami."

  - slug: prawo/ochrona-zatrudnienia/ochrona-przed-zwolnieniem
    category: prawo/ochrona-zatrudnienia
    title:
      en: Protection against dismissal during pregnancy and parental leave
      pl: Ochrona przed zwolnieniem w ciąży i podczas urlopów rodzicielskich
    summary:
      en: What employment protection generally means and why individual circumstances matter.
      pl: Na czym zasadniczo polega ochrona zatrudnienia i dlaczego znaczenie mają szczegóły konkretnej sytuacji.
    tags:
      en: [employment protection, pregnancy, dismissal]
      pl: [ochrona zatrudnienia, ciąża, zwolnienie]
    links:
      - label:
          en: Official labour law information
          pl: Oficjalne informacje z zakresu prawa pracy
        url: https://www.gov.pl/web/rodzina
      - label:
          en: Labour law resources
          pl: Materiały dotyczące prawa pracy
        url: https://isap.sejm.gov.pl/
    content:
      en:
        - "Pregnancy and certain forms of parental leave provide employees with specific employment protections, but the scope of protection depends on the type of contract and the circumstances."
        - "There are statutory exceptions, so a general internet rule should not be treated as a complete assessment of an individual case."
        - "If an employer proposes termination, a change of contract, or another major employment decision, keep copies of documents and check the legal basis."
        - "When the situation is disputed, an employment law adviser, trade union, or appropriate public institution can help explain the available options."
      pl:
        - "Ciąża oraz niektóre formy urlopów związanych z rodzicielstwem zapewniają pracownikowi określoną ochronę zatrudnienia, ale jej zakres zależy między innymi od rodzaju umowy i sytuacji pracownika."
        - "Przepisy przewidują wyjątki, dlatego ogólnej informacji znalezionej w internecie nie należy traktować jako pełnej oceny konkretnego przypadku."
        - "Jeżeli pracodawca proponuje rozwiązanie umowy, zmianę jej warunków lub inne istotne działanie, warto zachować dokumenty i sprawdzić podstawę prawną."
        - "W przypadku sporu pomocne może być skonsultowanie sytuacji z doradcą prawa pracy, związkiem zawodowym albo właściwą instytucją publiczną."

  - slug: finanse/benefity-dla-rodzin/becikowe
    category: finanse/benefity-dla-rodzin
    title:
      en: Baby bonus and one-time birth-related benefits
      pl: Becikowe i jednorazowe świadczenia związane z urodzeniem dziecka
    summary:
      en: What to check before applying for a one-time birth benefit and which conditions may apply.
      pl: Co sprawdzić przed złożeniem wniosku o jednorazowe świadczenie z tytułu urodzenia dziecka.
    tags:
      en: [baby bonus, benefits, finances]
      pl: [becikowe, świadczenia, finanse]
    links:
      - label:
          en: Official family benefits information
          pl: Oficjalne informacje o świadczeniach rodzinnych
        url: https://www.gov.pl/web/rodzina
      - label:
          en: Family benefits information
          pl: Informacje o świadczeniach rodzinnych
        url: https://www.zus.pl/
    content:
      en:
        - "The one-time birth benefit commonly known as the baby bonus is subject to statutory conditions, which can include income criteria and health-care requirements."
        - "Before applying, check the current income threshold, the deadline for submitting the application, and the documents required by the relevant authority."
        - "Some birth-related support is separate from the baby bonus, so families should check whether other benefits may apply to their situation."
        - "Keep confirmation of the submitted application and any documents proving eligibility."
      pl:
        - "Jednorazowe świadczenie z tytułu urodzenia dziecka, powszechnie nazywane becikowym, jest uzależnione od warunków określonych w przepisach, w tym od kryteriów dochodowych i wymogów dotyczących opieki medycznej."
        - "Przed złożeniem wniosku należy sprawdzić aktualny próg dochodowy, termin złożenia dokumentów oraz wymagania właściwego urzędu."
        - "Niektóre formy pomocy związane z narodzinami dziecka są niezależne od becikowego, dlatego warto sprawdzić pełny katalog dostępnych świadczeń."
        - "Warto zachować potwierdzenie złożenia wniosku oraz dokumenty potwierdzające spełnienie warunków."

  - slug: finanse/benefity-dla-rodzin/zasilek-macierzynski
    category: finanse/benefity-dla-rodzin
    title:
      en: Maternity benefit and planning household income
      pl: Zasiłek macierzyński i planowanie budżetu rodziny
    summary:
      en: How maternity-related benefits affect household finances and what to check before leave.
      pl: Jak świadczenia związane z rodzicielstwem wpływają na budżet i co sprawdzić przed urlopem.
    tags:
      en: [maternity benefit, income, budgeting]
      pl: [zasiłek macierzyński, dochód, budżet]
    links:
      - label:
          en: Maternity benefit information
          pl: Informacje o zasiłku macierzyńskim
        url: https://www.zus.pl/
      - label:
          en: Family support information
          pl: Informacje o wsparciu rodziny
        url: https://www.gov.pl/web/rodzina
    content:
      en:
        - "A new baby can significantly change household finances, especially when one parent temporarily stops working or reduces working hours."
        - "Before leave begins, check how the benefit is calculated in your situation, when payments are expected, and which documents must be submitted."
        - "It can be useful to create a simple budget covering housing, food, medical expenses, childcare, transport, and one-off baby purchases."
        - "Benefit calculations can depend on employment status and individual circumstances, so current official information should be checked before planning major expenses."
      pl:
        - "Narodziny dziecka mogą znacząco zmienić budżet gospodarstwa domowego, szczególnie gdy jeden z rodziców czasowo przestaje pracować lub ogranicza wymiar pracy."
        - "Przed rozpoczęciem urlopu warto sprawdzić sposób wyliczania świadczenia, przewidywany termin wypłat oraz dokumenty wymagane w danej sytuacji."
        - "Pomocne jest przygotowanie prostego budżetu obejmującego mieszkanie, żywność, wydatki medyczne, opiekę nad dzieckiem, transport i jednorazowe zakupy."
        - "Sposób obliczania świadczeń może zależeć od rodzaju zatrudnienia i indywidualnej sytuacji, dlatego przed planowaniem większych wydatków warto sprawdzić aktualne informacje."

  - slug: finanse/budzet-rodziny/koszt-wyprawki
    category: finanse/budzet-rodziny
    title:
      en: How to plan a realistic baby budget
      pl: Jak zaplanować realistyczny budżet na wyprawkę dla dziecka
    summary:
      en: A practical way to divide baby expenses into essential purchases, recurring costs, and optional extras.
      pl: Praktyczny sposób podziału wydatków na niezbędną wyprawkę, koszty stałe i rzeczy dodatkowe.
    tags:
      en: [baby budget, expenses, planning]
      pl: [budżet dziecka, wydatki, planowanie]
    links:
      - label:
          en: Family support information
          pl: Informacje o wsparciu rodzin
        url: https://www.gov.pl/web/rodzina
      - label:
          en: Consumer information
          pl: Informacje dla konsumentów
        url: https://uokik.gov.pl/
    content:
      en:
        - "A baby does not need every product marketed to new parents. Start with a short list of items required for sleep, feeding, clothing, hygiene, transport, and basic healthcare."
        - "Separate one-time purchases from recurring expenses such as nappies, formula if used, medicines, and childcare."
        - "Second-hand clothes, borrowed equipment, and carefully chosen used items can reduce costs, provided that safety is not compromised."
        - "Keep a reserve for unexpected expenses rather than spending the entire budget before the baby arrives."
      pl:
        - "Dziecko nie potrzebuje wszystkich produktów reklamowanych przyszłym rodzicom. Warto zacząć od krótkiej listy rzeczy potrzebnych do snu, karmienia, ubierania, higieny, transportu i podstawowej opieki."
        - "Dobrze oddzielić zakupy jednorazowe od stałych wydatków, takich jak pieluchy, mleko modyfikowane, jeśli jest stosowane, leki czy opieka nad dzieckiem."
        - "Używane ubrania, pożyczony sprzęt i rozsądnie wybrane rzeczy z drugiej ręki mogą obniżyć koszty, o ile nie wpływa to na bezpieczeństwo."
        - "Warto pozostawić część budżetu jako rezerwę na nieprzewidziane wydatki zamiast wydawać wszystko przed narodzinami."

  - slug: finanse/budzet-rodziny/oplacenie-opieki-nad-dzieckiem
    category: finanse/budzet-rodziny
    title:
      en: How to compare childcare costs
      pl: Jak porównać koszty opieki nad dzieckiem
    summary:
      en: How to compare nursery, childminder, nanny, and family childcare options using the real monthly cost.
      pl: Jak porównać żłobek, opiekuna, nianię i pomoc rodziny pod kątem rzeczywistych kosztów miesięcznych.
    tags:
      en: [childcare, costs, family budget]
      pl: [opieka nad dzieckiem, koszty, budżet rodziny]
    links:
      - label:
          en: Childcare information
          pl: Informacje o opiece nad dziećmi
        url: https://www.gov.pl/web/rodzina
      - label:
          en: Family support information
          pl: Informacje o wsparciu rodziny
        url: https://www.gov.pl/web/rodzina
    content:
      en:
        - "The cheapest option on paper is not always the cheapest in practice. Compare fees together with transport, meals, working hours, holidays, and possible additional charges."
        - "When comparing a nursery with a nanny or family care, calculate the monthly cost for the same number of hours."
        - "Consider how each arrangement affects the parents' ability to work, commute, and respond to illness or unexpected schedule changes."
        - "Local subsidies and childcare programmes can change the final cost, so check current rules in your municipality."
      pl:
        - "Najtańsza opcja na papierze nie zawsze okazuje się najtańsza w praktyce. Warto uwzględnić opłaty, transport, wyżywienie, godziny opieki, dni wolne i dodatkowe koszty."
        - "Porównując żłobek, nianię i opiekę rodziny, najlepiej przeliczyć koszt dla podobnej liczby godzin miesięcznie."
        - "Trzeba również uwzględnić wpływ wybranej formy opieki na możliwość pracy rodziców, dojazdy oraz reagowanie na choroby dziecka i nagłe zmiany."
        - "Lokalne dopłaty i programy wsparcia mogą zmieniać końcowy koszt, dlatego warto sprawdzić aktualne zasady obowiązujące w gminie."

  - slug: praca/elastyczna-praca/elastyczny-czas-pracy-po-urodzeniu
    category: praca/elastyczna-praca
    title:
      en: Flexible working arrangements after having a baby
      pl: Elastyczna organizacja pracy po urodzeniu dziecka
    summary:
      en: How flexible schedules, part-time work, and remote work can help parents manage childcare and employment.
      pl: Jak elastyczny czas pracy, część etatu i praca zdalna mogą ułatwić połączenie opieki z pracą.
    tags:
      en: [flexible work, parenting, employment]
      pl: [elastyczna praca, rodzicielstwo, zatrudnienie]
    links:
      - label:
          en: Flexible work information
          pl: Informacje o elastycznej organizacji pracy
        url: https://www.gov.pl/web/rodzina
      - label:
          en: Employee rights
          pl: Prawa pracownika
        url: https://www.gov.pl/web/rodzina
    content:
      en:
        - "After returning to work, parents may benefit from arrangements such as adjusted working hours, part-time employment, or remote work where available."
        - "Before making a request, identify the hours when childcare is actually available and the periods when another adult can provide backup."
        - "A workable schedule should account for commuting, feeding, appointments, illness, and the possibility that childcare arrangements may occasionally fail."
        - "Discuss practical details with the employer early enough to avoid building a schedule that works only on paper."
      pl:
        - "Po powrocie do pracy rodzic może korzystać z rozwiązań takich jak zmiana rozkładu czasu pracy, część etatu lub praca zdalna, jeśli są dostępne w danej sytuacji."
        - "Przed złożeniem wniosku warto określić godziny rzeczywiście dostępnej opieki oraz momenty, w których można liczyć na pomoc drugiej osoby."
        - "Dobry harmonogram powinien uwzględniać dojazdy, karmienie, wizyty, choroby dziecka oraz sytuacje, w których zaplanowana opieka nagle odpada."
        - "Szczegóły najlepiej omówić z pracodawcą odpowiednio wcześnie, aby plan nie działał wyłącznie na papierze."

  - slug: praca/plan-powrotu-do-pracy/organizacja-opieki-po-powrocie
    category: praca/plan-powrotu-do-pracy
    title:
      en: Organising childcare before returning to work
      pl: Organizacja opieki nad dzieckiem przed powrotem do pracy
    summary:
      en: A practical checklist for arranging childcare, backup plans, and daily routines before returning to employment.
      pl: Praktyczna lista rzeczy do ustalenia przed powrotem do pracy, w tym opieka awaryjna i codzienny harmonogram.
    tags:
      en: [childcare, return to work, planning]
      pl: [opieka, powrót do pracy, organizacja]
    links:
      - label:
          en: Childcare information
          pl: Informacje dotyczące opieki nad dziećmi
        url: https://www.gov.pl/web/rodzina
      - label:
          en: Family support
          pl: Wsparcie dla rodzin
        url: https://www.gov.pl/web/rodzina
    content:
      en:
        - "Before returning to work, write down who is responsible for childcare on each weekday and what happens when the planned caregiver is unavailable."
        - "A backup plan is particularly important for illness, nursery closures, appointments, and unexpected work commitments."
        - "It helps to practise the morning routine before the actual return to work so that transport, meals, clothing, and drop-off times are realistic."
        - "Parents should also agree who handles urgent calls from the nursery or doctor instead of assuming that one person will always be available."
      pl:
        - "Przed powrotem do pracy warto rozpisać, kto odpowiada za opiekę nad dzieckiem w poszczególne dni oraz co dzieje się w przypadku niedostępności głównego opiekuna."
        - "Plan awaryjny jest szczególnie ważny przy chorobie dziecka, zamknięciu placówki, wizytach lekarskich i nagłych obowiązkach zawodowych."
        - "Dobrym rozwiązaniem jest przećwiczenie porannego harmonogramu jeszcze przed powrotem do pracy, aby sprawdzić realny czas na transport, posiłki, ubieranie i dotarcie do placówki."
        - "Rodzice powinni również ustalić, kto reaguje na pilny telefon ze żłobka, przedszkola lub gabinetu lekarskiego, zamiast zakładać, że zawsze będzie to ta sama osoba."

  - slug: praca/elastyczna-praca/powrot-do-pracy-a-karmienie
    category: praca/elastyczna-praca
    title:
      en: Returning to work while breastfeeding
      pl: Powrót do pracy podczas karmienia piersią
    summary:
      en: Practical ways to combine employment with breastfeeding or expressing milk after returning to work.
      pl: Praktyczne sposoby łączenia pracy z karmieniem piersią lub odciąganiem pokarmu po powrocie do pracy.
    tags:
      en: [breastfeeding, work, parenting]
      pl: [karmienie piersią, praca, rodzicielstwo]
    links:
      - label:
          en: Breastfeeding information
          pl: Informacje o karmieniu piersią
        url: https://www.gov.pl/web/gis
      - label:
          en: Employee rights information
          pl: Informacje o prawach pracownika
        url: https://www.gov.pl/web/rodzina
    content:
      en:
        - "Returning to work does not automatically mean that breastfeeding has to stop. Families can choose a feeding arrangement that fits the baby's needs and the parent's working conditions."
        - "Some parents feed before and after work and express milk during the day, while others use a combination of breast milk and other feeding methods."
        - "If expressing milk at work, plan where it can be done, how milk will be stored, and how the schedule fits around meetings or other duties."
        - "Employment rules can provide specific rights connected with breastfeeding, so check the current regulations that apply to your situation."
      pl:
        - "Powrót do pracy nie oznacza automatycznie konieczności zakończenia karmienia piersią. Rodzina może wybrać sposób karmienia dopasowany do potrzeb dziecka i warunków pracy."
        - "Niektórzy rodzice karmią przed i po pracy oraz odciągają pokarm w ciągu dnia, inni łączą mleko matki z innymi metodami żywienia."
        - "Jeżeli pokarm jest odciągany w pracy, warto wcześniej ustalić miejsce, sposób przechowywania oraz harmonogram, który można pogodzić z obowiązkami."
        - "Przepisy prawa pracy przewidują określone uprawnienia związane z karmieniem piersią, dlatego warto sprawdzić aktualne zasady dotyczące konkretnej sytuacji."

  - slug: praca/plan-powrotu-do-pracy/powrot-do-pracy-po-urlopie
    category: praca/plan-powrotu-do-pracy
    title:
      en: Preparing for the first weeks back at work
      pl: Jak przygotować się do pierwszych tygodni pracy po urlopie
    summary:
      en: How to make the transition back to employment more manageable and avoid an overloaded first month.
      pl: Jak zaplanować powrót do pracy, aby pierwsze tygodnie nie zamieniły się w organizacyjny maraton.
    tags:
      en: [return to work, planning, wellbeing]
      pl: [powrót do pracy, planowanie, dobrostan]
    links:
      - label:
          en: Employment and family information
          pl: Informacje dotyczące pracy i rodziny
        url: https://www.gov.pl/web/rodzina
      - label:
          en: Labour law information
          pl: Informacje z zakresu prawa pracy
        url: https://www.gov.pl/web/rodzina
    content:
      en:
        - "The first weeks back at work can be demanding because parents are adapting to a new routine at the same time as they resume professional responsibilities."
        - "It helps to reduce unnecessary commitments, prepare meals and clothes in advance, and agree on who handles recurring household tasks."
        - "Expect occasional disruptions. A child may become ill, childcare may change, or a work deadline may move unexpectedly."
        - "A sustainable return is more useful than trying to reproduce the exact workload and lifestyle from before the baby was born."
      pl:
        - "Pierwsze tygodnie po powrocie do pracy mogą być wymagające, ponieważ rodzic jednocześnie wraca do obowiązków zawodowych i uczy się nowej organizacji dnia."
        - "Pomaga ograniczenie zbędnych zobowiązań, wcześniejsze przygotowywanie posiłków i ubrań oraz jasny podział powtarzalnych obowiązków domowych."
        - "Warto założyć, że czasem coś się rozsypie. Dziecko może zachorować, opieka może się zmienić, a termin zawodowy może nagle zostać przesunięty."
        - "Lepszym celem jest stabilny powrót do pracy niż próba odtworzenia dokładnie takiego samego trybu życia i obciążenia jak przed narodzinami dziecka."

  - slug: faq/kiedy-do-lekarza-w-ciazy
    category: faq
    title:
      en: When should I contact a doctor during pregnancy?
      pl: Kiedy w ciąży trzeba skontaktować się z lekarzem?
    summary:
      en: A practical overview of symptoms that should prompt medical advice or urgent assessment.
      pl: Praktyczne zestawienie objawów, przy których warto skontaktować się z lekarzem lub pilnie szukać pomocy.
    tags:
      en: [faq, pregnancy, warning signs]
      pl: [faq, ciąża, objawy alarmowe]
    links:
      - label:
          en: Pregnancy health information
          pl: Informacje o zdrowiu w ciąży
        url: https://www.gov.pl/web/zdrowie
      - label:
          en: Medical guidance
          pl: Porady medyczne
        url: https://www.mp.pl/
    content:
      en:
        - "Some pregnancy symptoms are common, but sudden or severe changes should not be ignored."
        - "Urgent medical assessment may be needed in situations such as heavy bleeding, severe abdominal pain, loss of consciousness, severe shortness of breath, or other rapidly worsening symptoms."
        - "Later in pregnancy, a significant change in the baby's usual movements should be discussed promptly with the maternity team."
        - "If you are unsure whether a symptom is serious, contacting a healthcare professional is safer than trying to diagnose the situation yourself."
      pl:
        - "Niektóre objawy ciąży są częste, ale nagłe lub silne zmiany nie powinny być ignorowane."
        - "Pilnej oceny medycznej mogą wymagać między innymi obfite krwawienie, silny ból brzucha, utrata przytomności, znaczna duszność lub inne szybko nasilające się objawy."
        - "W późniejszej ciąży wyraźna zmiana zwyczajowej aktywności ruchowej dziecka powinna zostać szybko omówiona z personelem prowadzącym ciążę."
        - "Jeżeli nie masz pewności, czy objaw jest poważny, bezpieczniej skontaktować się z personelem medycznym niż próbować samodzielnie ustalać rozpoznanie."

  - slug: faq/co-zabrac-do-szpitala
    category: faq
    title:
      en: What should I pack for the maternity hospital?
      pl: Co zabrać do szpitala na poród?
    summary:
      en: A practical packing checklist for documents, clothing, hygiene items, and newborn essentials.
      pl: Praktyczna lista dokumentów, ubrań, środków higienicznych i rzeczy potrzebnych dla noworodka.
    tags:
      en: [faq, hospital, birth bag]
      pl: [faq, szpital, torba porodowa]
    links:
      - label:
          en: Maternity care information
          pl: Informacje dotyczące opieki okołoporodowej
        url: https://www.gov.pl/web/zdrowie
      - label:
          en: Pregnancy and birth guidance
          pl: Porady dotyczące ciąży i porodu
        url: https://www.mp.pl/
    content:
      en:
        - "A practical hospital bag usually includes identification and medical documents, comfortable clothing, hygiene products, chargers, and items needed after birth."
        - "For the baby, the exact list depends on the maternity ward. Typical items can include clothes, nappies, and other basic newborn supplies."
        - "Check the hospital's own list before packing because some wards provide certain items while others expect parents to bring them."
        - "Packing the bag several weeks before the expected due date can reduce stress if labour starts earlier than planned."
      pl:
        - "Praktyczna torba do szpitala zwykle zawiera dokument tożsamości i dokumentację medyczną, wygodne ubrania, środki higieniczne, ładowarkę oraz rzeczy potrzebne po porodzie."
        - "W przypadku dziecka dokładna lista zależy od konkretnego oddziału. Zwykle potrzebne są ubranka, pieluchy i podstawowe akcesoria dla noworodka."
        - "Przed spakowaniem torby warto sprawdzić listę przygotowaną przez szpital, ponieważ część oddziałów zapewnia niektóre rzeczy, a inne wymagają ich przyniesienia."
        - "Spakowanie torby kilka tygodni przed przewidywanym terminem porodu może ograniczyć stres, jeśli poród rozpocznie się wcześniej."

  - slug: faq/jak-wybrac-polozna
    category: faq
    title:
      en: How to choose a midwife and prepare for maternity care
      pl: Jak wybrać położną i przygotować się do opieki okołoporodowej
    summary:
      en: What to consider when choosing maternity care and what questions are worth asking beforehand.
      pl: Co wziąć pod uwagę przy wyborze opieki położnej i jakie pytania warto zadać wcześniej.
    tags:
      en: [faq, midwife, maternity care]
      pl: [faq, położna, opieka okołoporodowa]
    links:
      - label:
          en: Maternity care information
          pl: Informacje o opiece okołoporodowej
        url: https://www.gov.pl/web/zdrowie
      - label:
          en: Patient information
          pl: Informacje dla pacjentów
        url: https://pacjent.gov.pl/
    content:
      en:
        - "When choosing a midwife or maternity care provider, consider communication style, availability, location, and the type of support offered."
        - "Ask how appointments are organised, how to contact the midwife when questions arise, and what support is available before and after birth."
        - "It is useful to discuss birth preparation, breastfeeding, postpartum recovery, newborn care, and situations that require contacting a doctor."
        - "The best arrangement is one in which you understand who to contact and what to do when a new question or problem appears."
      pl:
        - "Przy wyborze położnej lub osoby zapewniającej opiekę okołoporodową warto uwzględnić sposób komunikacji, dostępność, lokalizację oraz zakres oferowanego wsparcia."
        - "Dobrze wcześniej zapytać, jak wyglądają wizyty, w jaki sposób można skontaktować się z położną w razie pytań oraz jakie wsparcie jest dostępne przed i po porodzie."
        - "Warto omówić przygotowanie do porodu, karmienie piersią, regenerację po porodzie, opiekę nad noworodkiem oraz sytuacje wymagające kontaktu z lekarzem."
        - "Najważniejsze jest jasne ustalenie, z kim można się skontaktować i co zrobić, gdy pojawi się nowe pytanie lub problem."

  - slug: faq/jak-liczyc-tydzien-ciazy
    category: faq
    title:
      en: How pregnancy weeks and the due date are calculated
      pl: Jak oblicza się tydzień ciąży i termin porodu
    summary:
      en: Why pregnancy dating can be confusing and how clinicians establish an estimated due date.
      pl: Dlaczego liczenie tygodni ciąży bywa mylące i jak ustala się przewidywany termin porodu.
    tags:
      en: [faq, pregnancy dating, due date]
      pl: [faq, wiek ciąży, termin porodu]
    links:
      - label:
          en: Pregnancy information
          pl: Informacje o ciąży
        url: https://pacjent.gov.pl/
      - label:
          en: Pregnancy care guidance
          pl: Porady dotyczące prowadzenia ciąży
        url: https://www.gov.pl/web/zdrowie
    content:
      en:
        - "Pregnancy is conventionally dated from the first day of the last menstrual period, which means that the calculated pregnancy age does not begin on the day of conception."
        - "The estimated due date is an approximation rather than a guaranteed delivery date. Only a small proportion of births occur exactly on the calculated date."
        - "An ultrasound examination can help assess pregnancy dating, particularly when the menstrual history is uncertain or the dates do not match the clinical picture."
        - "Use the pregnancy week provided by your healthcare team when interpreting test schedules and recommendations."
      pl:
        - "Wiek ciąży standardowo liczy się od pierwszego dnia ostatniej miesiączki, dlatego początek wyliczanego wieku ciąży nie przypada na dzień zapłodnienia."
        - "Przewidywany termin porodu jest orientacyjną datą, a nie gwarantowanym dniem porodu. Tylko niewielka część dzieci rodzi się dokładnie w wyznaczonym terminie."
        - "Badanie ultrasonograficzne może pomóc w ocenie wieku ciąży, szczególnie gdy data ostatniej miesiączki jest niepewna lub nie pasuje do obrazu klinicznego."
        - "Przy planowaniu badań i wizyt najlepiej posługiwać się wiekiem ciąży ustalonym przez osobę prowadzącą ciążę."

  - slug: faq
    category: faq
    title:
      en: Key answers about pregnancy and practical support
      pl: Najważniejsze odpowiedzi na pytania o ciążę i wsparcie
    summary:
      en: Short, practical answers to common questions about pregnancy and support.
      pl: Krótkie, praktyczne odpowiedzi na najczęściej zadawane kwestie.
    tags:
      en: [faq, quick guidance, safety]
      pl: [faq, szybkie informacje, bezpieczeństwo]
    links:
      - label:
          en: Health information for pregnant women
          pl: Wersje informacji i pomocy dla kobiet w ciąży
        url: https://www.gov.pl/web/zdrowie
      - label:
          en: Family guidance and support
          pl: Wsparcie i porady dla rodzin
        url: https://www.gov.pl/web/rodzina
    content:
      en:
        - "Does everyone need psychological support in pregnancy? Many women feel stress, anger, anxiety, or exhaustion, and those emotions are common and not a sign of failure."
        - "Should you apply for benefits early? Yes, if you are unsure, gather the documents and ask for help from your local office."
        - "Are tests always required? Many are recommended or necessary for safety, but your care team can explain what is needed in your situation."
        - "Should you speak with your employer about leave early? Yes, agreeing on details before birth makes the schedule clearer and easier to manage."
      pl:
        - "Czy w każdej ciąży można potrzebować pomocy psychologicznej? Tak, złość, lęk i zmęczenie są częste i nie są oznaką problemu."
        - "Czy warto od razu składać wnioski o świadczenia? Tak, jeśli masz niepewność, sprawdź dostępne dokumenty i skorzystaj z pomocy w urzędzie."
        - "Czy badania są obowiązkowe? Wiele z nich jest zalecanych i czasem niezbędnych dla bezpieczeństwa matki i dziecka."
        - "Czy pracownica w ciąży powinna konsultować plan urlopu z pracodawcą? Tak, warto ustalić szczegóły wcześniej, aby mieć przewidywalny harmonogram."
